name: Build and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x gradlew

      - run: ./gradlew build

      - uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: U8403aUi
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: forge/build/libs/!(*-@(shadow|sources)).jar

          dependencies: |
            "emi@1.1.24+1.20.1+fabric(required){modrinth:fRiHVvU7}",
            "fabric@0.81.1+1.19.4(required){modrinth:P7dR8mSH}"

          game-versions: 1.20.1

      - uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: U8403aUi
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: fabric/build/libs/!(*-@(shadow|sources)).jar

          dependencies: "emi@1.1.24+1.20.1+forge(required){modrinth:fRiHVvU7}"

          game-versions: 1.20.1
